[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cifar10-resnet-classifier"
version = "1.0.0"
description = "CIFAR-10 ResNet-9 (94-95% in about a minute on one GPU) with ablations, multi-seed evaluation, an image-upload FastAPI service and CPU/CUDA Docker images."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "pillow>=10",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
cifar = "cifar_classifier.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "D", "PT", "RUF"]
# N803/N806: `X`, `X_train` follow the scikit-learn convention for feature matrices.
# N812: `torch.nn.functional as F` is the PyTorch convention.
ignore = ["D105", "D107", "N803", "N806", "N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: needs CUDA", "slow: uses the real dataset"]

[tool.coverage.run]
source = ["cifar_classifier"]
branch = true

[tool.coverage.report]
show_missing = true
